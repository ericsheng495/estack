name: Feature knowledge

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test knowledge helper
        run: python3 -m unittest discover -s skills/project-knowledge/scripts -p 'test_*.py' -v
      - name: Validate project knowledge
        run: python3 skills/project-knowledge/scripts/knowledge.py check --project .
